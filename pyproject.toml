[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.12", "flit-scm", "wheel" ]

[project]
name = "joeflow"
readme = "README.md"
keywords = [
  "automation",
  "django",
  "framework",
  "process",
  "task",
  "workflow",
]
license = { file = "LICENSE" }
authors = [ { name = "Johannes Maron", email = "johannes@maron.family" } ]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: JavaScript",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Home Automation",
  "Topic :: Internet",
  "Topic :: Office/Business",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Office/Business :: Financial :: Point-Of-Sale",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Software Development",
]
dynamic = [ "description", "version" ]
dependencies = [
  "django>=6",
  "django-appconf",
]
optional-dependencies.graphviz = [
  "graphviz>=0.18",
]
optional-dependencies.reversion = [
  "django-reversion",
]
urls.Changelog = "https://github.com/codingjoe/joeflow/releases"
urls.Documentation = "https://joeflow.rtfd.io/"
urls.Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
urls.Homepage = "https://github.com/codingjoe/joeflow"
urls.Issues = "https://github.com/codingjoe/joeflow/issues"
urls.Releasenotes = "https://github.com/codingjoe/joeflow/releases/latest"
urls.Source = "https://github.com/codingjoe/joeflow"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-django",
]
docs = [
  "django-reversion",
  "furo",
  "graphviz>=0.18",
  "sphinx",
  "sphinxcontrib-spelling>=8.0.2",
]

[tool.setuptools_scm]
write_to = "joeflow/_version.py"

[tool.flit]
module.name = "joeflow"

[tool.djlint]
profile = "django"
exclude = ".direnv,.venv,venv"
indent = 2
max_line_length = 120

[tool.ruff]
src = [ "joeflow", "tests" ]
lint.select = [
  "B",  # flake8-bugbear
  "C",  # flake8-comprehensions
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "S",  # flake8-bandit
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]
lint.ignore = [ "B904", "C901", "D1", "E501", "S101" ]
lint.per-file-ignores."tests/**/*.py" = [ "B018", "DJ", "E731", "S" ]
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
lint.isort.split-on-trailing-comma = true
lint.pydocstyle.convention = "google"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = [
  "tests",
]
ini_options.norecursedirs = "tests/testapp"
ini_options.addopts = "--cov=joeflow --cov-report=xml --cov-report=term --doctest-modules"
ini_options.DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
report.skip_covered = true
report.show_missing = true
