[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.12", "flit-scm", "wheel" ]

[project]
name = "joeflow"
readme = "README.md"
keywords = [
  "automation",
  "django",
  "framework",
  "process",
  "task",
  "workflow",
]
license = { file = "LICENSE" }
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: JavaScript",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Home Automation",
  "Topic :: Internet",
  "Topic :: Office/Business",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Office/Business :: Financial :: Point-Of-Sale",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Software Development",
]
dynamic = [ "description", "version" ]
dependencies = [
  "django>=6",
  "django-appconf",
]
[[project.authors]]
name = "Johannes Maron"
email = "johannes@maron.family"
[project.optional-dependencies]
graphviz = [
  "graphviz>=0.18",
]
reversion = [
  "django-reversion",
]
[project.urls]
Changelog = "https://github.com/codingjoe/joeflow/releases"
Documentation = "https://joeflow.rtfd.io/"
Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
Homepage = "https://github.com/codingjoe/joeflow"
Issues = "https://github.com/codingjoe/joeflow/issues"
Releasenotes = "https://github.com/codingjoe/joeflow/releases/latest"
Source = "https://github.com/codingjoe/joeflow"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-django",
]
docs = [
  "django-reversion",
  "furo",
  "graphviz>=0.18",
  "sphinx",
  "sphinxcontrib-spelling>=8.0.2",
]

[tool.setuptools_scm]
write_to = "joeflow/_version.py"

[tool.flit]
[tool.flit.module]
name = "joeflow"

[tool.djlint]
profile = "django"
exclude = ".direnv,.venv,venv"
indent = 2
max_line_length = 120

[tool.ruff]
src = [ "joeflow", "tests" ]
[tool.ruff.lint]
extend-select = [
  "C90",
  "D",
  "D213",
  "DJ",
  "E",
  "G",
  "N",
  "PERF",
  "PT",
  "PTH",
  "RET",
  "S",
  "SIM",
  "SLOT",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = [ "D1", "D203", "D212", "E501", "RUF01" ]
per-file-ignores."tests/**" = [ "DJ006", "DJ007", "DJ008", "PLR2004", "S101", "S105", "S106", "S311", "S603", "S607" ]
isort.combine-as-imports = true
isort.force-wrap-aliases = true
isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
isort.split-on-trailing-comma = true
pydocstyle.convention = "google"

[tool.pytest]
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
  "tests",
]
norecursedirs = "tests/testapp"
addopts = "--cov=joeflow --cov-report=xml --cov-report=term --doctest-modules"
DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
[tool.coverage.report]
skip_covered = true
show_missing = true
