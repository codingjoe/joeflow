name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx --from build pyproject-build --sdist --wheel
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y gettext graphviz libenchant-2-2
      - uses: astral-sh/setup-uv@v7
      - run: uv run --group docs sphinx-build -W -b doctest docs docs/_build
      - run: uv run --group docs sphinx-build -W -b spelling docs docs/_build
      - run: uv run --group docs sphinx-build -W -b html docs docs/_build
  PyTest:
    permissions:
      contents: read
      id-token: write
    needs:
      - dist
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"
        django-version:
          - "6.0"
          - "6.1"
        extras:
          - ""
        include:
          - python-version: "3.14"
            django-version: "6.1"
            extras: "--extra reversion"
          - python-version: "3.14"
            django-version: "6.1"
            extras: "--extra graphviz"
          - python-version: "3.14"
            django-version: "6.1"
            extras: "--extra graphviz --extra reversion"
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt install -y graphviz
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run ${{ matrix.extras }} --with Django~=${{ matrix.django-version }}.0 pytest
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: python-${{ matrix.python-version }}-django-${{ matrix.django-version }}
